# 2.3: (nothing) - 2.4 requires the config version as the first non-comment
# line, and the storage version somewhere in the file.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

###############
# General
###############
log_path = /dev/stderr
auth_verbose=yes
mail_debug=yes
# 2.3: user=<%u> method=%m rip=%r rport=%b lip=%l lport=%a mpid=%e %c - 2.4
# replaced the single letter codes with named variables, see
# login_var_expand_empty_tab in src/login-common/client-common.c
login_log_format_elements = user=<%{user}> method=%{mechanism} rip=%{remote_ip} rport=%{remote_port} lip=%{local_ip} lport=%{local_port} mpid=%{mail_pid} %{secured}
# 2.3: protocols = sieve imap pop3 lmtp submission
protocols {
  sieve = yes
  imap = yes
  pop3 = yes
  lmtp = yes
  submission = yes
}
postmaster_address = {{ POSTMASTER }}@{{ DOMAIN }}
hostname = {{ HOSTNAMES.split(",")[0] }}
submission_host = {{ SMTP_ADDRESS }}
submission_relay_host = {{ SMTP_ADDRESS }}
submission_relay_port = 10025
submission_relay_trusted = yes
submission_relay_ssl = no
submission_max_mail_size = {{ MESSAGE_SIZE_LIMIT }}
submission_backend_capabilities = 8BITMIME DSN VRFY
submission_client_workarounds = mailbox-for-path whitespace-before-path
# disable BURL
imap_urlauth_host=
lmtp_proxy = yes
lmtp_client_workarounds = whitespace-before-path mailbox-for-path

{%- if SUBNET6 %}
listen = *,::
{% else %}
listen = *
{% endif %}

default_internal_user = dovecot
default_login_user = mail
default_internal_group = dovecot

haproxy_trusted_networks = {% if REAL_IP_FROM %}{% for from_ip in REAL_IP_FROM.split(',') %}{{ from_ip }} {% endfor %}{% endif %}

###############
# Authentication
###############
auth_username_chars =
auth_mechanisms = plain login

{%- if TLS %}
ssl = required
# 2.3: ssl_cert = <file / ssl_key = <file - the 2.4 settings are of type FILE,
# which reads the path given to it, so the "<" prefix is gone. See
# ssl_server_setting_defines in src/lib-ssl-iostream/ssl-settings.c
ssl_server_cert_file = {{ TLS[0] }}
ssl_server_key_file = {{ TLS[1] }}
{%- if TLS_FLAVOR in ['letsencrypt','mail-letsencrypt'] %}
# 2.3: ssl_alt_cert / ssl_alt_key
ssl_server_alt_cert_file = {{ TLS[2] }}
ssl_server_alt_key_file = {{ TLS[3] }}
{% endif %}
# intermediate configuration
ssl_min_protocol = TLSv1.2
ssl_cipher_list = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
# 2.3: ssl_prefer_server_ciphers = no - now an enum of client:server
ssl_server_prefer_ciphers = client
# 2.3: ssl_options = no_compression no_ticket - 2.4 only knows the flags
# "compression" and "no_ticket" and has compression off by default, so
# no_compression is now both unnecessary and rejected as an unknown flag
# (ssl_settings_check() in src/lib-ssl-iostream/ssl-settings.c).
ssl_options = no_ticket
{% else %}
# 2.3: disable_plaintext_auth = no
auth_allow_cleartext = yes
ssl = no
{% endif %}

# 2.3: passdb { driver = lua; args = file=... blocking=yes }
# The block name selects the driver and the args became settings. blocking is
# passdb_use_worker, written unprefixed inside the filter (passdb.c: blocking =
# set->use_worker). It defaults to no, so leaving it out would move the lookup
# out of the auth-worker process into the auth process.
passdb lua {
  lua_file = /etc/dovecot/login.lua
  use_worker = yes
}

service auth-worker {
  user = dovenull
  group = dovenull
  unix_listener auth-worker {
  }
}

service anvil {
  unix_listener anvil-auth-penalty {
    mode = 0
  }
}

{%- if PORT_4190 %}
service managesieve-login {
  executable = managesieve-login
  inet_listener sieve {
    port = 4190
{%- if PROXY_PROTOCOL_4190 %}
    haproxy = yes
{% endif %}
  }
  inet_listener sieve-webmail {
    port = 14190
  }
  # 2.3: service_count = 0
  restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}
{% endif %}

protocol imap {
  mail_max_userip_connections = 20
  imap_idle_notify_interval = 29mins
}

service imap-login {
  inet_listener imap {
    port = {% if PORT_143 %}143{% else %}0{% endif %}
{%- if PROXY_PROTOCOL_143 %}
    haproxy = yes
{% endif %}
  }
{%- if TLS_993 %}
  inet_listener imaps {
    port = 993
    ssl = yes
{%- if PROXY_PROTOCOL_993 %}
    haproxy = yes
{% endif %}
  }
{% endif %}
  inet_listener imap-webmail {
   port = 10143
  }
  restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

service pop3-login {
  inet_listener pop3 {
    port = {% if PORT_110 %}110{% else %}0{% endif %}
{%- if PROXY_PROTOCOL_110 %}
    haproxy = yes
{% endif %}
  }
{%- if TLS_995 and PORT_995 %}
  inet_listener pop3s {
    port = 995
    ssl = yes
{%- if PROXY_PROTOCOL_995 %}
    haproxy = yes
{% endif %}
  }
{% endif %}
  restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

recipient_delimiter = {{ RECIPIENT_DELIMITER }}
service lmtp {
  # 2.3: user = $default_internal_user - 2.4 dropped the $setting reference,
  # so the value of default_internal_user above is spelled out here.
  user = dovecot
  inet_listener lmtp {
    port = 2525
  }
}

service submission-login {
   inet_listener submission {
    port = {% if PORT_587 %}587{% else %}0{% endif %}
{%- if PROXY_PROTOCOL_587 %}
    haproxy = yes
{% endif %}
   }
{%- if TLS_465 %}
   inet_listener submissions {
    port = 465
    ssl = yes
{%- if PROXY_PROTOCOL_465 %}
    haproxy = yes
{% endif %}
   }
{% endif %}
   inet_listener submission-webmail {
    port = 10025
   }
  restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

!include_try /overrides/dovecot/proxy.conf
