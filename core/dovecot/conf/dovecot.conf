## Mailu dovecot configuration (Dovecot 2.4 syntax)
##
## Converted from the 2.3 configuration with https://dovecot.org/upgrader/ and
## corrected by hand where the converter had no rule. Lines carrying a
## "2.3:" comment are the ones that changed; everything else kept its name.
## The section layout is unchanged from the 2.3 file so both can be read
## side by side.

# Must be the first non-comment line. Declares which configuration syntax and
# defaults this file is written against, so it must not be newer than the
# dovecot being run: 2.4.1 rejects anything above 2.4.1. The upgrader stamps
# its own version here (2.4.2); 2.4.0 is deliberate, it is the oldest 2.4 and
# therefore accepted by every 2.4.x.
dovecot_config_version = 2.4.0
# The oldest dovecot that must be able to read files written by this instance.
dovecot_storage_version = 2.4.0

###############
# General
###############
log_path = /dev/stderr
# 2.3: protocols = imap pop3 lmtp sieve
protocols {
  imap = yes
  pop3 = yes
  lmtp = yes
  sieve = yes
}
postmaster_address = {{ POSTMASTER }}@{{ DOMAIN }}
hostname = {{ HOSTNAMES.split(",")[0] }}
{%- if PROXY_PROTOCOL_25 %}
submission_host = {{ HOSTNAMES.split(",")[0] }}
{% else %}
submission_host = {{ FRONT_ADDRESS }}
{% endif %}
{%- if SUBNET6 %}
listen = *,::
{% else %}
listen = *
{% endif %}

default_internal_user = dovecot
default_login_user = mail
default_internal_group = dovecot

login_trusted_networks = {{ SUBNET }} {{ SUBNET6 }}

###############
# Mailboxes
###############
first_valid_gid = 8
first_valid_uid = 8
# 2.3: mail_location = maildir:/mail/%u  (split into driver and path)
mail_driver = maildir
mail_path = ~/
mail_home = /mail/%{user}
mail_uid = mail
mail_gid = mail
mail_privileged_group = mail
mail_access_groups = mail
maildir_stat_dirs = yes
mailbox_list_index = yes
mail_vsize_bg_after_count = 100
default_vsz_limit = 2GB

# 2.3: mail_plugins = $mail_plugins quota quota_clone zlib fts fts_flatcurve
mail_plugins {
  quota = yes
  quota_clone = yes
  {%- if COMPRESSION %}
  mail_compress = yes
  {%- endif %}
  {%- if (FULL_TEXT_SEARCH or '').lower() not in ['off', 'false', '0'] %}
  fts = yes
  fts_flatcurve = yes
  {%- endif %}
}

namespace inbox {
  inbox = yes
  {% for mailbox in ("Trash", "Drafts", "Sent", "Junk") %}
  mailbox {{ mailbox }} {
    auto = subscribe
    special_use = \{{ mailbox }}
    {%- if mailbox == "Junk" %}

    # 2.3: plugin { imapsieve_mailbox1_* }
    sieve_script report-spam {
      type = before
      driver = file
      path = /conf/report-spam.sieve
      cause = COPY APPEND
    }
    {%- endif %}
  }
  {% endfor %}
  # 2.3: plugin { imapsieve_mailbox2_* } - anything copied out of Junk
  imapsieve_from Junk {
    sieve_script report-ham {
      type = before
      driver = file
      path = /conf/report-ham.sieve
      cause = COPY
    }
  }
}

# 2.3: plugin { quota = count:User quota }
quota User {
  driver = count
}
# 2.3: plugin { quota_vsizes = yes } - no longer needed in 2.4

# 2.3: plugin { quota_clone_dict = proxy:/tmp/podop.socket:quota }
quota_clone {
  dict proxy {
    name = quota
    socket_path = /tmp/podop.socket
  }
}

{% if (FULL_TEXT_SEARCH or '').lower() not in ['off', 'false', '0'] %}
# 2.3: plugin { fts = flatcurve }
fts flatcurve {
}
# 2.3: fts_index_timeout
fts_search_timeout = 50s
fts_autoindex = yes
# 2.3: fts_enforced = yes  (removed; the 2.4 fts settings are autoindex,
# autoindex_max_recent_msgs, decoder_*, driver, search, search_add_missing,
# search_read_fallback, header_excludes/includes, search_timeout and
# message_max_size). "enforced" meant do not fall back to a slow non-indexed
# search, so it maps onto search_read_fallback with the logic inverted - the
# CE default is yes, i.e. 2.3's fts_enforced = no.
fts_search_read_fallback = no
fts_header_excludes = Received DKIM-* ARC-* X-* x-* Comments Delivered-To Return-Path Authentication-Results Message-ID References In-Reply-To Thread-* Accept-Language Content-* MIME-Version
# 2.3: fts_tokenizers / fts_filters
language_tokenizers = generic email-address
language_filters = normalizer-icu lowercase snowball stopwords
# 2.3: fts_languages = {{ FULL_TEXT_SEARCH }} - now one block per language,
# and the per-language filters that used to be fts_filters_<lang>
{%- for lang in (FULL_TEXT_SEARCH or 'en').split(",") %}
{%- set lang = lang | trim %}
language {{ lang }} {
  {%- if loop.first %}
  default = yes
  {%- endif %}
  {%- if lang == 'en' %}
  filters = normalizer-icu lowercase snowball english-possessive stopwords
  {%- endif %}
  {%- if lang == 'fr' %}
  filters = normalizer-icu lowercase snowball contractions stopwords
  {%- endif %}
}
{%- endfor %}
# 2.3: fts_autoindex_exclude / fts_autoindex_exclude1 - now per-mailbox filters
mailbox \Trash {
  fts_autoindex = no
}
mailbox \Junk {
  fts_autoindex = no
}
{%- if FULL_TEXT_SEARCH_ATTACHMENTS %}
# 2.3: plugin { fts_tika = ... }
fts_decoder_driver = tika
fts_decoder_tika_url = http://{{ FTS_ATTACHMENTS_ADDRESS }}:9998/tika/
{%- endif %}
{% endif %}

{% if COMPRESSION in [ 'gz', 'bz2', 'lz4', 'zstd' ] %}
# 2.3: plugin { zlib_save = {{ COMPRESSION }} }
mail_compress_write_method = {{ COMPRESSION }}
{%- if COMPRESSION_LEVEL %}
# 2.3: plugin { zlib_save_level } - one setting covered every method. 2.4 has
# one setting per method and not every method has one: bz2 expresses the level
# as its block size and lz4 has none at all, so an unconditional
# compress_<method>_level would be an unknown setting for those two. See
# ostream-zlib.c, ostream-zstd.c and ostream-bzlib.c in src/lib-compression.
{%- if COMPRESSION == 'gz' %}
compress_gz_level = {{ COMPRESSION_LEVEL }}
{%- elif COMPRESSION == 'zstd' %}
compress_zstd_level = {{ COMPRESSION_LEVEL }}
{%- elif COMPRESSION == 'bz2' %}
compress_bz2_block_size_100k = {{ COMPRESSION_LEVEL }}
{%- endif %}
{%- endif %}
{%- endif %}

service indexer-worker {
  executable = /bin/nice -n 10 /usr/libexec/dovecot/indexer-worker
  # TODO: maybe MAXPROC? I guess it depends on how much RAM is available
  process_limit = 1
}

###############
# Authentication
###############
auth_username_chars =
auth_mechanisms = plain login
# 2.3: disable_plaintext_auth = no
auth_allow_cleartext = yes

# 2.3: passdb { driver = lua; args = file=... blocking=yes }
# The block name selects the driver and the args became settings. blocking is
# passdb_use_worker / userdb_use_worker, written unprefixed inside the filter
# (passdb.c: blocking = set->use_worker). It defaults to no, so leaving it out
# would move the lookup out of the auth-worker process into the auth process.
passdb lua {
  lua_file = /etc/dovecot/login.lua
  use_worker = yes
}

# 2.3: userdb { driver = lua; args = file=... blocking=yes }
userdb lua {
  lua_file = /etc/dovecot/login.lua
  use_worker = yes
}

service auth {
  unix_listener auth-userdb {
  }
}

service auth-worker {
  unix_listener auth-worker {
  }
}

###############
# IMAP & POP
###############
protocol imap {
  mail_plugins {
    imap_quota = yes
    imap_sieve = yes
  }
  mail_max_userip_connections = 20
  imap_idle_notify_interval = 29mins
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  # 2.3: service_count = 0
  restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

###############
# Delivery
###############
recipient_delimiter = {{ RECIPIENT_DELIMITER }}
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

service lmtp {
  inet_listener lmtp {
    port = 2525
  }
}

###############
# Filtering
###############
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
  restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

protocol sieve {
  ssl = no
}

service managesieve {
  process_limit = 1024
}

# 2.3: plugin { sieve = file:~/sieve;active=~/.dovecot.sieve }
sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

# 2.3: plugin { sieve_before = dict:proxy:/tmp/podop.socket:sieve }
# The converter turned this into driver=file with a dict: path, which cannot
# work. Dovecot looks up priv/sieve/name/<name> and priv/sieve/data/<id>,
# which is exactly what the admin API serves.
sieve_script before-0 {
  type = before
  driver = dict
  name = default
  dict proxy {
    name = sieve
    socket_path = /tmp/podop.socket
  }
}

# 2.3: plugin { sieve_plugins = sieve_imapsieve sieve_extprograms }
sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}

# 2.3: plugin { sieve_extensions = +spamtest +spamtestplus +editheader }
sieve_extensions {
  spamtest = yes
  spamtestplus = yes
  editheader = yes
}

# 2.3: plugin { sieve_global_extensions = +vnd.dovecot.execute }
sieve_global_extensions {
  vnd.dovecot.execute = yes
}

# Sieve execute
sieve_execute_bin_dir = /conf/bin

# Send vacation replies even for aliases
# See the Pigeonhole documentation about warnings: http://wiki2.dovecot.org/Pigeonhole/Sieve/Extensions/Vacation
# It appears that our implementation of mail delivery meets criteria of section 4.5
# from RFC 5230 and that disabling the recipient checks is not an issue here.
# 2.3: sieve_vacation_dont_check_recipient = yes  (renamed AND inverted)
sieve_vacation_check_recipient = no

# Include the recipient in vacation replies so that DKIM applies
sieve_vacation_send_from_recipient = yes

# Use To: header from original message becaus envelope has a SRS address
sieve_vacation_to_header_ignore_envelope = yes

# extract spam score from headers
sieve_spamtest_status_type = strlen
sieve_spamtest_status_header = X-Spam-Level
# 2.3: sieve_spamtest_max_value
sieve_spamtest_score_max_value = 15

service anvil {
  unix_listener anvil-auth-penalty {
    mode = 0
  }
}

###############
# Extensions
###############

!include_try /overrides/dovecot.conf
