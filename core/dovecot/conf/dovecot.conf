###############
# Config
###############
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

###############
# General
###############
log_path = /dev/stderr
protocols = imap pop3 lmtp sieve
postmaster_address = {{ POSTMASTER }}@{{ DOMAIN }}
hostname = {{ HOSTNAMES.split(",")[0] }}
{%- if PROXY_PROTOCOL_25 %}
submission_host = {{ HOSTNAMES.split(",")[0] }}
{% else %}
submission_host = {{ FRONT_ADDRESS }}
{% endif %}
{%- if SUBNET6 %}
listen = *,::
{% else %}
listen = *
{% endif %}

default_internal_user = dovecot
default_login_user = mail
default_internal_group = dovecot

login_trusted_networks = {{ SUBNET }} {{ SUBNET6 }}

###############
# dict server
###############
dict_server {
  dict quota {
    driver = proxy
    proxy_socket_path = /tmp/podop.socket
  }
  dict sieve {
    driver = proxy
    proxy_socket_path = /tmp/podop.socket
  }
}

###############
# Mailboxes
###############
first_valid_gid = 8
first_valid_uid = 8
mail_driver = maildir
mail_path = /mail/%{user}
mail_home = /mail/%{user}
mail_uid = mail
mail_gid = mail
mail_privileged_group = mail
mail_access_groups = mail
maildir_stat_dirs = yes
mailbox_list_index = yes
mail_vsize_bg_after_count = 100
mail_plugins {
  quota = yes
  quota_clone = yes
{%- if COMPRESSION %}
  mail_compress = yes
{%- endif %}
{%- if (FULL_TEXT_SEARCH or '').lower() not in ['off', 'false', '0'] %}
  fts = yes
  fts_flatcurve = yes
{%- endif %}
}
default_vsz_limit = 2GB

namespace inbox {
  inbox = yes
  
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
	fts_autoindex = no
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
	fts_autoindex = no
    
    sieve_script report-spam {
      sieve_script_type = before
      cause = copy append
      path = /conf/report-spam.sieve
    }
  }
}

imapsieve_from Junk {
  sieve_script report-ham {
    sieve_script_type = before
    cause = copy
    path = /conf/report-ham.sieve
  }
}

# Quota
quota "User quota" {
  driver = count
}

quota_clone {
  dict proxy {
    name = quota
  }
}

{% if (FULL_TEXT_SEARCH or '').lower() not in ['off', 'false', '0'] %}
# FTS
fts flatcurve {
}
fts_search_timeout = 50s
fts_autoindex = yes
fts_search_add_missing = yes

# FTS Header Excludes - jetzt als Boolean-Liste
fts_header_excludes {
  Received = yes
  DKIM-* = yes
  ARC-* = yes
  X-* = yes
  x-* = yes
  Comments = yes
  Delivered-To = yes
  Return-Path = yes
  Authentication-Results = yes
  Message-ID = yes
  References = yes
  In-Reply-To = yes
  Thread-* = yes
  Accept-Language = yes
  Content-* = yes
  MIME-Version = yes
}

{% for lang in (FULL_TEXT_SEARCH or 'en').split(",") %}
{%- if lang == 'en' %}
language en {
  language_default = yes
  tokenizers = generic email-address
  filters = normalizer-icu lowercase snowball english-possessive stopwords
}
{%- elif lang == 'fr' %}
language fr {
  tokenizers = generic email-address
  filters = normalizer-icu lowercase snowball contractions stopwords
}
{%- else %}
language {{ lang }} {
  tokenizers = generic email-address
  filters = normalizer-icu lowercase snowball stopwords
}
{%- endif %}
{% endfor %}

{% if FULL_TEXT_SEARCH_ATTACHMENTS %}
fts_decoder_driver = tika
fts_decoder_tika_url = http://{{ FTS_ATTACHMENTS_ADDRESS }}:9998/tika/
{% endif %}
{% endif %}

# Compression
{% if COMPRESSION in [ 'gz', 'bz2', 'lz4', 'zstd' ] %}
mail_compress_save = {{ COMPRESSION }}
{% endif %}
{% if COMPRESSION_LEVEL %}
mail_compress_save_level = {{ COMPRESSION_LEVEL }}
{% endif %}

service indexer-worker {
  executable = /bin/nice -n 10 /usr/libexec/dovecot/indexer-worker
  # TODO: maybe MAXPROC? I guess it depends on how much RAM is available
  process_limit = 1
}

###############
# Authentication
###############
auth_username_chars =
auth_mechanisms = plain login
auth_allow_cleartext = yes

# Lua passdb configuration
passdb mailu_lua {
  driver = lua
  lua_file = /conf/lua/mailu-auth.lua
  use_worker = yes
  lua_settings {
    admin_url = http://admin:8080
  }
}

# Lua userdb configuration
userdb mailu_lua {
  driver = lua
  lua_file = /conf/lua/mailu-auth.lua
  use_worker = yes
}

service auth {
  unix_listener auth-userdb {
  }
}

service auth-worker {
  unix_listener auth-worker {
  }
}

###############
# IMAP & POP
###############
protocol imap {
  mail_plugins {
    imap_quota = yes
    imap_sieve = yes
  }
  mail_max_userip_connections = 20
  imap_idle_notify_interval = 29mins
}

protocol pop3 {

}

service imap-login {
  inet_listener imap {
    port = 143
  }
  service_restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  service_restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

###############
# Delivery
###############
recipient_delimiter = {{ RECIPIENT_DELIMITER }}
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

service lmtp {
  inet_listener lmtp {
    port = 2525
  }
}

###############
# Filtering
###############
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
  service_restart_request_count = unlimited
  client_limit = 25000
  process_min_avail = {{ CPU_COUNT }}
  process_limit = {{ CPU_COUNT }}
  vsz_limit = 256M
}

protocol sieve {
  ssl = no
}

service managesieve {
  process_limit = 1024
}

sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}
sieve_extensions = spamtest spamtestplus editheader
sieve_global_extensions = vnd.dovecot.execute

# Sieve execute
sieve_execute_bin_dir = /conf/bin

# Vacation settings
sieve_vacation_check_recipient = no
sieve_vacation_send_from_recipient = yes
sieve_vacation_to_header_ignore_envelope = yes

# Spamtest
sieve_spamtest_status_type = strlen
sieve_spamtest_status_header = X-Spam-Level
sieve_spamtest_score_max_value = 15

sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

sieve_script before {
  sieve_script_type = before
  driver = dict
  dict proxy {
    name = sieve
  }
}

service anvil {
  unix_listener anvil-auth-penalty {
    mode = 0
  }
}

###############
# Extensions
###############

!include_try /overrides/dovecot.conf
